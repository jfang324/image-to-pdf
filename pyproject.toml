[tool.poetry]
name = "image-to-pdf"
version = "1.1"
description = "A Python package for converting images to PDF files."
authors = ["Jeffery Fang <Jefferyfang324@gmail.com>"]
readme = "README.md"
repository = "https://github.com/jfang324/image-to-pdf"

[tool.poetry.dependencies]
python = "<4.0,>=3.10"
pillow = "^10.4.0"
textual = "^8.1.1"

[tool.poetry.scripts]
image-to-pdf = "image_to_pdf.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
coverage = "^7.6.1"
pyright = "^1.1.389"
ruff = "^0.8.0"
textual = { extras = ["dev"], version = "^8.1.1" }
pytest-asyncio = "^1.3.0"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "FIX", "ARG", "PTH", "PERF", "S"]
ignore = ["E501", "B008", "PTH110", "PTH112", "PTH113", "PTH118", "PTH119", "PTH208", "PTH109", "B904", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["image_to_pdf"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
